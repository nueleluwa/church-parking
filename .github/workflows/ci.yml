name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder
          SESSION_SECRET: build-only-placeholder-secret-0123456789abcdef
          APP_URL: https://example.org
      # The browser tests (pnpm test:e2e) use a real Supabase test project and secrets,
      # so they are run by hand or in a separate protected workflow, not on every push.
