# ONLY for a server used for nothing else (provision.sh --fresh-server). Anyone who reaches the server by
# its bare address, or by a name that is not ours, gets nothing. Never installed on a shared server, where
# it would clash with the other sites' own default.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    ssl_reject_handshake on;
    return 444;
}
