# Used BEFORE a server certificate is in place (first run of deploy/provision.sh), so the site can be
# reached and a Let's Encrypt certificate can be requested. It is replaced by churchparking.conf once
# /etc/ssl/churchparking/origin.pem and origin.key exist. Never use it for real traffic: it is not encrypted.

include /etc/nginx/snippets/cloudflare-realip.conf;

upstream church_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name churchparking.online www.churchparking.online _;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Vercel-Forwarded-For "";

    location /p/ {
        access_log off;
        proxy_pass http://church_app;
    }
    location / {
        proxy_pass http://church_app;
    }
}
