# Used BEFORE a server certificate is in place, so the site can be reached while the certificate is being
# set up. It is replaced by churchparking.conf once /etc/ssl/churchparking/origin.pem and origin.key exist.
# It is not encrypted: do not use it for real traffic. Ports are filled in by deploy/provision.sh.

upstream church_app {
    server 127.0.0.1:__APP_PORT__;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name churchparking.online www.churchparking.online;
    server_tokens off;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Vercel-Forwarded-For "";

    location /p/ {
        access_log off;
        proxy_pass http://church_app;
    }
    location / {
        proxy_pass http://church_app;
    }
}
