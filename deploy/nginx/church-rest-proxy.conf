# A small door on this server's own loopback address only (127.0.0.1, never reachable from outside).
# The app talks to its database through the same web address style the hosted service used
# (/rest/v1/...), but the database interface (PostgREST) answers at the top level, so this
# strips the /rest/v1 prefix. Ports are filled in by deploy/db/install-db.sh.
server {
    listen 127.0.0.1:__REST_PROXY_PORT__;
    server_name _;
    access_log off;
    client_max_body_size 2m;

    location /rest/v1/ {
        rewrite ^/rest/v1/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:__REST_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
    location / {
        return 404;
    }
}
