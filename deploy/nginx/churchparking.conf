# The public site, served over https behind Cloudflare. Installed by deploy/provision.sh, which fills in the
# port numbers (written as __APP_PORT__ here). It only touches the names churchparking.online and
# www.churchparking.online, so other sites on the same server are left alone.
#
# Needs a SERVER certificate at /etc/ssl/churchparking/origin.pem with its key origin.key
# (a Cloudflare Origin CA certificate). See deploy/README.md.

# One address may make about 30 requests a second. Each phone has its own address at Cloudflare, so this is
# generous for real use and still stops a flood.
limit_req_zone $binary_remote_addr zone=church_app:10m rate=30r/s;

upstream church_app {
    server 127.0.0.1:__APP_PORT__;
    keepalive 32;
}

# http goes to https
server {
    listen 80;
    listen [::]:80;
    server_name churchparking.online www.churchparking.online;

    # Let's Encrypt renewals, if that is how a certificate is made
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://churchparking.online$request_uri;
    }
}

# www goes to the main name
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.churchparking.online;

    ssl_certificate     /etc/ssl/churchparking/origin.pem;
    ssl_certificate_key /etc/ssl/churchparking/origin.key;
    return 301 https://churchparking.online$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name churchparking.online;

    ssl_certificate     /etc/ssl/churchparking/origin.pem;
    ssl_certificate_key /etc/ssl/churchparking/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # We believe the visitor address Cloudflare reports (CF-Connecting-IP) only for requests that really come
    # from Cloudflare's addresses. Kept inside this site so other sites on the server are not affected.
    include /etc/nginx/snippets/cloudflare-realip.conf;

    # Optional: only accept connections that really come from Cloudflare (Authenticated Origin Pulls).
    include /etc/nginx/snippets/church-aop.conf;

    client_max_body_size 1m;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # The headers the app reads to tell visitors apart for its rate limits. The app trusts these, so they are
    # always set here, and anything a visitor sends under these names is thrown away.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Vercel-Forwarded-For "";
    proxy_read_timeout 30s;

    # Pass links hold a secret token (docs/security.md). They are never written to the access log.
    location /p/ {
        access_log off;
        limit_req zone=church_app burst=60 nodelay;
        proxy_pass http://church_app;
    }

    # Built files never change under the same name, so they can be kept for a year. The files of recent versions
    # are kept on disk (church-deploy.sh), so a phone with an older version of the page still finds its files
    # after a deploy instead of reloading itself. Anything not found there is asked of the app.
    location /_next/static/ {
        root /srv/church-parking/static;
        try_files $uri @church_app_static;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
    location @church_app_static {
        proxy_pass http://church_app;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        limit_req zone=church_app burst=60 nodelay;
        proxy_pass http://church_app;
    }

    access_log /var/log/nginx/churchparking.access.log;
    error_log  /var/log/nginx/churchparking.error.log warn;
}
