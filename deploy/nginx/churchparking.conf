# The public site, served over https behind Cloudflare. Installed by deploy/provision.sh.
# Needs a SERVER certificate at /etc/ssl/churchparking/origin.pem and its key at origin.key
# (a Cloudflare Origin CA certificate, or Let's Encrypt). See deploy/README.md.

# The addresses Cloudflare connects from. Only for these do we believe the visitor address Cloudflare reports.
include /etc/nginx/snippets/cloudflare-realip.conf;

# One address may make about 30 requests a second. Phones on church wifi each have their own address
# at Cloudflare, so this is generous for real use and still stops a flood.
limit_req_zone $binary_remote_addr zone=church_app:10m rate=30r/s;

upstream church_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Anyone who reaches the server by its bare address, or by a name that is not ours, gets nothing.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    ssl_reject_handshake on;
    return 444;
}

# http goes to https
server {
    listen 80;
    listen [::]:80;
    server_name churchparking.online www.churchparking.online;

    # Let's Encrypt renewals, if that is how the certificate is made
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://churchparking.online$request_uri;
    }
}

# www goes to the main name
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.churchparking.online;

    ssl_certificate     /etc/ssl/churchparking/origin.pem;
    ssl_certificate_key /etc/ssl/churchparking/origin.key;
    return 301 https://churchparking.online$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name churchparking.online;

    ssl_certificate     /etc/ssl/churchparking/origin.pem;
    ssl_certificate_key /etc/ssl/churchparking/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Optional: only accept connections that really come from Cloudflare (Authenticated Origin Pulls).
    # Turn on with: sudo /srv/church-parking/current/deploy/provision.sh --authenticated-origin-pulls
    include /etc/nginx/snippets/church-aop.conf;

    client_max_body_size 1m;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # The headers the app reads to tell visitors apart for its rate limits. The app trusts these, so they are
    # always set here and anything a visitor sends under these names is thrown away.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Vercel-Forwarded-For "";
    proxy_read_timeout 30s;

    # Pass links hold a secret token (docs/security.md). They are never written to the access log.
    location /p/ {
        access_log off;
        limit_req zone=church_app burst=60 nodelay;
        proxy_pass http://church_app;
    }

    # Built files never change under the same name, so they can be kept for a year.
    location /_next/static/ {
        proxy_pass http://church_app;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        limit_req zone=church_app burst=60 nodelay;
        proxy_pass http://church_app;
    }

    access_log /var/log/nginx/churchparking.access.log;
    error_log  /var/log/nginx/churchparking.error.log warn;
}
